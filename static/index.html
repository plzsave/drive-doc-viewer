<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Doc Viewer</title>
  <script>
    try {
      const savedTheme = localStorage.getItem("drive-doc-viewer-theme");
      const useDark = savedTheme
        ? savedTheme === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", useDark);
    } catch (_error) {
      document.documentElement.classList.toggle("dark", window.matchMedia("(prefers-color-scheme: dark)").matches);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.4/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.7/dist/purify.min.js"></script>
  <link id="highlight-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
  <link id="highlight-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.15.0/+esm";
    const theme = document.documentElement.classList.contains("dark") ? "dark" : "neutral";
    mermaid.initialize({ startOnLoad: false, theme, securityLevel: "strict" });
    window.mermaid = mermaid;
    window.dispatchEvent(new Event("mermaid-ready"));
  </script>
  <style>
    :root {
      color-scheme: light;

      /* Evidence Deck と共有する「検品台」の色 */
      --graphite-900: #131417;
      --graphite-800: #1a1b1e;
      --graphite-700: #232529;
      --graphite-600: #32353b;
      --graphite-500: #4a4e56;
      --bench-050: #f7f8fa;
      --bench-100: #eef0f3;
      --bench-200: #e4e7eb;
      --bench-300: #d3d8df;
      --ink-900: #14161a;
      --ink-700: #3a404a;
      --ink-500: #666d78;
      --ink-300: #939aa4;
      --ink-on-dark: #c8cdd4;
      --ink-on-dark-dim: #7d838c;
      --indigo: #4b4fa6;
      --indigo-hover: #3d4189;
      --indigo-wash: rgba(75, 79, 166, .12);
      --fail: #a63a3a;
      --pending: #b07d2b;
      --face-ui: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium",
        "Yu Gothic", "Noto Sans JP", "Segoe UI", system-ui, sans-serif;
      --face-data: ui-monospace, SFMono-Regular, "SF Mono", "Roboto Mono", Menlo,
        Consolas, monospace;
      --radius: 6px;
      --radius-lg: 10px;

      --document-field: var(--bench-100);
      --document-paper: #fff;
      --document-ink: var(--ink-900);
      --document-muted: var(--ink-500);
      --document-rule: var(--bench-300);
      --document-code: var(--bench-100);

      font-family: var(--face-ui);
      color: var(--ink-on-dark);
      background: var(--graphite-900);
    }

    .dark {
      color-scheme: dark;
      --document-field: var(--graphite-900);
      --document-paper: var(--graphite-800);
      --document-ink: var(--ink-on-dark);
      --document-muted: var(--ink-on-dark-dim);
      --document-rule: var(--graphite-600);
      --document-code: var(--graphite-700);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      background: var(--graphite-900);
      color: var(--ink-on-dark);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .data {
      font-family: var(--face-data);
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }
    :where(button, a, input):focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 2px;
    }

    .app-header {
      height: 54px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--graphite-800);
      border-bottom: 1px solid var(--graphite-600);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .app-heading { min-width: 0; flex: 1; }
    .app-mark {
      min-width: 36px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid var(--graphite-500);
      border-radius: 4px;
      color: var(--ink-on-dark-dim);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    .app-title { color: #f0f2f4; font-size: 14px; font-weight: 700; line-height: 1.3; }
    .app-subtitle { color: var(--ink-on-dark-dim); font-size: 10.5px; letter-spacing: .04em; }
    .shell {
      width: min(1240px, calc(100% - 32px));
      min-height: calc(100vh - 54px);
      margin: 0 auto;
      padding-bottom: 24px;
      display: flex;
      flex-direction: column;
    }

    .open-card {
      width: min(620px, 100%);
      margin: auto;
      padding: 24px;
      background: var(--graphite-800);
      border: 1px solid var(--graphite-600);
      border-radius: var(--radius-lg);
    }
    .open-card.hidden { display: none; }
    .shell:has(.viewer.visible) .open-card { margin: 20px auto 0; }
    .open-card::before {
      content: "";
      display: block;
      width: 40px;
      height: 2px;
      margin-bottom: 18px;
      background: var(--indigo);
    }
    .open-card h1 { margin: 0 0 7px; color: var(--ink-on-dark); font-size: 17px; line-height: 1.5; }
    .open-card p { margin: 0 0 20px; color: var(--ink-on-dark-dim); font-size: 12.5px; line-height: 1.7; }
    .open-form { display: flex; flex-direction: column; gap: 6px; }
    .open-label {
      color: var(--ink-on-dark-dim);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
    }
    .open-controls { display: flex; gap: 8px; }
    .url-input {
      min-width: 0;
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--graphite-600);
      border-radius: var(--radius);
      outline: none;
      color: var(--ink-on-dark);
      background: var(--graphite-700);
      font-family: var(--face-data);
      font-size: 13px;
      transition: border-color .12s, box-shadow .12s;
    }
    .url-input::placeholder { color: var(--graphite-500); }
    .url-input:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-wash); }
    .primary-button, .secondary-button {
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      transition: background .12s, border-color .12s, color .12s;
    }
    .primary-button { color: #fff; background: var(--indigo); }
    .primary-button:hover { background: var(--indigo-hover); }
    .primary-button:disabled { opacity: .55; cursor: wait; }
    .secondary-button {
      color: var(--ink-on-dark);
      background: transparent;
      border-color: var(--graphite-500);
      font-weight: 400;
      font-size: 12.5px;
      padding: 7px 11px;
    }
    .secondary-button:hover { color: #fff; background: var(--graphite-600); }
    .header-button {
      flex-shrink: 0;
      padding: 6px 9px;
      border: 1px solid var(--graphite-600);
      border-radius: var(--radius);
      color: var(--ink-on-dark-dim);
      background: transparent;
      font-size: 11.5px;
    }
    .header-button:hover { color: var(--ink-on-dark); background: var(--graphite-700); }
    .hint { margin-top: 11px; color: var(--ink-on-dark-dim); font-size: 11.5px; }
    .message {
      display: none;
      margin-top: 14px;
      padding: 9px 11px;
      border-radius: var(--radius);
      border-left: 2px solid transparent;
      font-size: 12px;
      line-height: 1.55;
    }
    .message.visible { display: block; }
    .message.loading { color: #afb2ed; background: var(--indigo-wash); border-left-color: var(--indigo); }
    .message.error { color: #df8a8a; background: rgba(166, 58, 58, .12); border-left-color: var(--fail); }
    .message.warning { color: #d1a35d; background: rgba(176, 125, 43, .12); border-left-color: var(--pending); }

    .viewer {
      display: none;
      margin-top: 20px;
      scroll-margin-top: 70px;
      background: var(--graphite-800);
      border: 1px solid var(--graphite-600);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .viewer.visible { display: block; }
    .viewer-bar {
      min-height: 54px;
      padding: 9px 12px 9px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--graphite-600);
    }
    .file-meta { min-width: 0; flex: 1; }
    .file-name {
      margin: 0;
      overflow: hidden;
      color: var(--ink-on-dark);
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-detail { margin-top: 2px; color: var(--ink-on-dark-dim); font-size: 10.5px; }
    .type-badge {
      padding: 3px 7px;
      border: 1px solid rgba(117, 121, 205, .35);
      border-radius: 999px;
      color: #afb2ed;
      background: var(--indigo-wash);
      font-family: var(--face-data);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .06em;
    }
    .viewer-body { min-height: 65vh; padding: 20px; background: var(--document-field); }
    .markdown-body {
      min-height: calc(65vh - 40px);
      max-width: 980px;
      margin: auto;
      padding: 38px clamp(24px, 5vw, 72px) 64px;
      border: 1px solid var(--document-rule);
      border-radius: var(--radius);
      color: var(--document-ink);
      background: var(--document-paper);
      line-height: 1.8;
    }
    .markdown-body h1, .markdown-body h2 { border-bottom: 1px solid var(--document-rule); padding-bottom: .3em; }
    .markdown-body h1 { margin-top: 0; font-size: 2em; }
    .markdown-body h2 { margin-top: 1.7em; font-size: 1.5em; }
    .markdown-body h3 { margin-top: 1.5em; }
    .markdown-body pre { overflow: auto; padding: 16px; border: 1px solid var(--document-rule); border-radius: var(--radius); background: var(--document-code); }
    .markdown-body code { padding: .18em .35em; border-radius: 4px; background: var(--document-code); font-family: var(--face-data); }
    .markdown-body pre code { padding: 0; background: transparent; }
    .markdown-body blockquote { margin-left: 0; padding-left: 1em; color: var(--document-muted); border-left: 3px solid var(--document-rule); }
    .markdown-body table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--document-rule); padding: 7px 12px; }
    .markdown-body th { background: var(--document-code); }
    .markdown-body img { max-width: 100%; height: auto; }
    .markdown-body a { color: var(--indigo); }
    .markdown-body .mermaid { margin: 1.5em 0; overflow-x: auto; text-align: center; }
    .markdown-body .mermaid svg { max-width: 100%; height: auto; }
    .mermaid-error { padding: 12px; border: 1px solid rgba(166, 58, 58, .4); border-radius: var(--radius); color: var(--fail); background: rgba(166, 58, 58, .08); font: 12px var(--face-data); text-align: left; white-space: pre-wrap; }
    .html-preview { display: block; width: 100%; height: calc(100vh - 150px); height: calc(100dvh - 150px); min-height: 360px; border: 1px solid var(--document-rule); border-radius: var(--radius); background: #fff; }
    .empty { display: grid; place-items: center; min-height: 40vh; color: var(--document-muted); text-align: center; padding: 40px; }

    .dark .markdown-body a { color: #9296dc; }
    .dark .mermaid-error { color: #df8a8a; }

    @media (max-width: 680px) {
      .app-header { padding: 0 14px; }
      .app-mark { display: none; }
      .app-subtitle { display: none; }
      .header-button { padding: 7px 9px; }
      .theme-label { display: none; }
      .shell { width: min(100% - 20px, 1240px); }
      .open-card { margin-block: 20px; padding: 18px; }
      .open-controls { flex-direction: column; }
      .primary-button { width: 100%; }
      .viewer-bar { align-items: flex-start; flex-wrap: wrap; }
      .file-meta { flex-basis: calc(100% - 80px); }
      .viewer-body { padding: 10px; }
      .markdown-body { min-height: calc(65vh - 20px); padding: 28px 20px 48px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-mark data" aria-hidden="true">DDV</div>
    <div class="app-heading">
      <div class="app-title">Drive Doc Viewer</div>
      <div class="app-subtitle">Drive文書の閲覧台</div>
    </div>
    <button id="theme-toggle" class="header-button" type="button" aria-label="文書をダーク表示に切り替える" title="文書をダーク表示に切り替える">
      <span id="theme-icon" aria-hidden="true">☾</span>
      <span id="theme-label" class="theme-label">文書: ダーク</span>
    </button>
    <button id="open-panel-toggle" class="header-button" type="button" aria-controls="open-card" aria-expanded="true">指定欄を隠す</button>
  </header>

  <main class="shell">
    <section id="open-card" class="open-card">
      <h1>閲覧するドキュメントを指定してください</h1>
      <p>Google Driveの共有URLまたはファイルIDから、Markdown / HTMLを読み込みます。</p>
      <form id="open-form" class="open-form">
        <label class="open-label" for="url-input">ドキュメント</label>
        <div class="open-controls">
          <input id="url-input" class="url-input" type="text" autocomplete="off" spellcheck="false"
            placeholder="https://drive.google.com/file/d/… またはファイルID">
          <button id="open-button" class="primary-button" type="submit">開く</button>
        </div>
      </form>
      <div class="hint">閲覧権限のあるファイルだけを開きます。内容の更新・保存は行いません。</div>
      <div id="message" class="message" role="status"></div>
    </section>

    <section id="viewer" class="viewer" aria-live="polite">
      <div class="viewer-bar">
        <span id="type-badge" class="type-badge"></span>
        <div class="file-meta">
          <h2 id="file-name" class="file-name"></h2>
          <div id="file-detail" class="file-detail data"></div>
        </div>
        <button id="copy-link" class="secondary-button" type="button">リンクをコピー</button>
        <button id="close-viewer" class="secondary-button" type="button">閲覧を終了</button>
      </div>
      <div id="viewer-body" class="viewer-body"></div>
    </section>
  </main>

  <script>
    window.__INITIAL_REQUEST__ = <?!= initialRequestJson ?>;
  </script>
  <!--CLIENT_JS-->
</body>
</html>
