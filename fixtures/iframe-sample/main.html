<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iframe表示テスト</title>
  <style>
    :root {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; }
    .page { max-width: 1160px; margin: 0 auto; }
    .eyebrow { color: #2563eb; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0 10px; font-size: clamp(26px, 4vw, 40px); }
    .lead { max-width: 760px; margin: 0; color: #64748b; line-height: 1.7; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 8px 12px;
      border: 1px solid #bbf7d0; border-radius: 999px; color: #166534; background: #f0fdf4; font-size: 13px; font-weight: 700;
    }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .frames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 26px; }
    .frame-card { overflow: hidden; border: 1px solid #dbe2ea; border-radius: 16px; background: white; box-shadow: 0 14px 35px rgba(51, 65, 85, .08); }
    .frame-label { padding: 10px 14px; border-bottom: 1px solid #e5eaf0; color: #64748b; background: #f8fafc; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    iframe { display: block; width: 100%; height: 460px; border: 0; background: white; }
    .checklist { margin-top: 22px; padding: 18px 20px; border: 1px solid #dbeafe; border-radius: 14px; background: #eff6ff; }
    .checklist h2 { margin: 0 0 8px; font-size: 15px; }
    .checklist ul { margin: 0; padding-left: 20px; color: #475569; line-height: 1.7; font-size: 13px; }
    @media (max-width: 780px) {
      body { padding: 18px; }
      .frames { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">Drive Doc Viewer Fixture</div>
    <h1>iframe表示テスト</h1>
    <p class="lead">
      このページが表示されていれば、エントリーHTMLの読み込みは成功です。
      下の2枚は、それぞれ相対パスで指定した別のHTMLファイルです。
    </p>
    <div class="status">main.html を表示中</div>

    <section class="frames" aria-label="子HTMLの表示結果">
      <article class="frame-card">
        <div class="frame-label">children/child01.html</div>
        <iframe src="children/child01.html" title="子ドキュメント1"></iframe>
      </article>
      <article class="frame-card">
        <div class="frame-label">children/child02.html</div>
        <iframe src="children/child02.html" title="子ドキュメント2"></iframe>
      </article>
    </section>

    <aside class="checklist">
      <h2>期待する表示</h2>
      <ul>
        <li>左側は青系の自己完結したHTML</li>
        <li>右側は外部CSS、CSS内背景画像、HTML内SVG画像を利用した緑系のHTML</li>
        <li>JavaScriptは使用していないため、安全モードでそのまま表示可能</li>
      </ul>
    </aside>
  </main>
</body>
</html>
